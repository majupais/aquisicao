<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Comercial — Seventech</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080f;--surface:#0e0f1c;--surface2:#161728;--surface3:#1e2035;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#eeeef8;--muted:rgba(238,238,248,0.5);--dim:rgba(238,238,248,0.25);
  --accent:#7c6aff;--accent-dim:rgba(124,106,255,0.14);
  --teal:#00d4aa;--teal-dim:rgba(0,212,170,0.12);
  --amber:#ffb830;--amber-dim:rgba(255,184,48,0.12);
  --red:#ff5b5b;--red-dim:rgba(255,91,91,0.1);
  --green:#22d47c;--green-dim:rgba(34,212,124,0.1);
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:14px;line-height:1.5;overflow-x:hidden}
/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:220px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;z-index:100}
.sidebar-logo{padding:0 20px 24px;border-bottom:1px solid var(--border)}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:#fff;margin-bottom:10px}
.logo-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.logo-sub{font-size:11px;color:var(--dim);margin-top:1px}
.nav{padding:14px 12px;flex:1;display:flex;flex-direction:column;gap:3px}
.nav-section{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);padding:10px 8px 6px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;text-align:left;width:100%;transition:background 0.15s,color 0.15s}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0}
/* active states */
.nav-btn[data-page="fat"].active{background:rgba(34,212,124,0.1);color:var(--green)}
.nav-btn[data-page="fat"].active .nav-dot{background:var(--green)}
.nav-btn[data-page="time"].active{background:var(--surface3);color:var(--text)}
.nav-btn[data-page="time"].active .nav-dot{background:var(--muted)}
.nav-btn[data-page="v0"].active{background:var(--accent-dim);color:var(--accent)}
.nav-btn[data-page="v0"].active .nav-dot{background:var(--accent)}
.nav-btn[data-page="v1"].active{background:var(--teal-dim);color:var(--teal)}
.nav-btn[data-page="v1"].active .nav-dot{background:var(--teal)}
.nav-btn[data-page="v2"].active{background:var(--amber-dim);color:var(--amber)}
.nav-btn[data-page="v2"].active .nav-dot{background:var(--amber)}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border)}
.refresh-btn{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background 0.2s,color 0.2s}
.refresh-btn:hover{background:var(--surface3);color:var(--text)}
.last-update{font-size:10px;color:var(--dim);text-align:center;margin-top:7px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2.5s infinite;margin-right:5px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
/* MAIN */
.main{margin-left:220px;min-height:100vh;padding:32px 36px}
.page{display:none}.page.active{display:block}
/* PAGE HEADER */
.page-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
/* KPI */
.kpi-row{display:grid;gap:14px;margin-bottom:24px}
.kpi-row-4{grid-template-columns:repeat(4,1fr)}
.kpi-row-3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px}
.kpi-label{font-size:11px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.kpi-val{font-family:'DM Sans',sans-serif;font-size:26px;font-weight:500;line-height:1;letter-spacing:-0.5px;margin-bottom:4px}
.kpi-sub{font-size:12px;color:var(--muted)}
/* FAT TABLE */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.fat-head{display:grid;grid-template-columns:1fr 160px 160px 100px;padding:11px 20px;background:var(--surface2);border-bottom:1px solid var(--border)}
.fat-head span{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim)}
.fat-head span:not(:first-child){text-align:right}
.fat-row{display:grid;grid-template-columns:1fr 160px 160px 100px;padding:13px 20px;border-bottom:1px solid var(--border);align-items:center;transition:background 0.12s}
.fat-row:last-child{border-bottom:none}
.fat-row:hover{background:var(--surface2)}
.fat-acum{text-align:right;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500}
.fat-meta{text-align:right;font-size:12px;color:var(--muted)}
.fat-pct-cell{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.fat-pct{font-size:12px;font-weight:500}
.bar-bg{width:70px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px}
.fat-foot{display:grid;grid-template-columns:1fr 160px 160px 100px;padding:14px 20px;background:var(--surface2);border-top:2px solid var(--border2)}
.fat-foot span{font-size:13px;font-weight:600}
.fat-foot span:not(:first-child){text-align:right}
/* TEAM CARDS */
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}
.team-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform 0.15s,border-color 0.15s}
.team-card:hover{transform:translateY(-2px)}
.tc-header{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;flex-shrink:0}
.tc-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}
.tc-conv{font-size:11px;color:var(--muted);margin-top:1px}
.badge{margin-left:auto;font-size:10px;font-weight:600;padding:3px 10px;border-radius:20px}
.tc-nums{display:grid;grid-template-columns:repeat(4,1fr)}
.tc-cell{padding:13px 8px;text-align:center;border-right:1px solid var(--border)}
.tc-cell:last-child{border-right:none}
.tc-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.tc-val{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:500}
/* WEEKS GRID */
.weeks-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.week-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.week-label-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.06em}
.week-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.week-num-item .wn-label{font-size:10px;color:var(--dim);margin-bottom:2px}
.week-num-item .wn-val{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:500}
/* SELLER PAGE */
.seller-hero{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px 30px;margin-bottom:22px;display:flex;align-items:center;gap:20px}
.hero-av{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:20px;flex-shrink:0}
.hero-name{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;margin-bottom:3px}
.hero-sub{font-size:13px;color:var(--muted)}
.hero-badges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hero-badge{font-size:12px;font-weight:500;padding:5px 14px;border-radius:22px}
/* WEEKS TABLE */
.weeks-table{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:22px}
.wt-head{display:grid;padding:11px 20px;background:var(--surface2);border-bottom:1px solid var(--border)}
.wt-row{display:grid;padding:12px 20px;border-bottom:1px solid var(--border);align-items:center}
.wt-row:last-child{border-bottom:none}
.wt-row:hover{background:var(--surface2)}
.wt-cell{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--dim)}
.wt-cell:not(:first-child){text-align:center}
.wt-name{font-size:13px;color:var(--text)}
.wt-val{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;text-align:center}
/* COLORS */
.c-green{color:var(--green)}.c-teal{color:var(--teal)}.c-accent{color:var(--accent)}
.c-amber{color:var(--amber)}.c-red{color:var(--red)}.c-muted{color:var(--muted)}.c-dim{color:var(--dim)}
/* LOADING */
#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999}
.spinner{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-bar{background:var(--red-dim);border:1px solid rgba(255,91,91,0.25);border-radius:10px;padding:10px 16px;color:var(--red);font-size:12px;margin-bottom:18px;display:none}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <span style="font-size:13px;color:var(--muted)">Carregando dados...</span>
</div>

<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">7T</div>
    <div class="logo-name">Seventech</div>
    <div class="logo-sub">Dashboard Comercial</div>
  </div>
  <div class="nav">
    <div class="nav-section">Visão geral</div>
    <button class="nav-btn active" data-page="fat" onclick="goTo('fat')"><span class="nav-dot"></span>Faturamento</button>
    <button class="nav-btn" data-page="time" onclick="goTo('time')"><span class="nav-dot"></span>Resultado do time</button>
    <div class="nav-section">Vendedoras</div>
    <button class="nav-btn" data-page="v0" onclick="goTo('v0')"><span class="nav-dot"></span><span id="nav-v0">Vendedora 1</span></button>
    <button class="nav-btn" data-page="v1" onclick="goTo('v1')"><span class="nav-dot"></span><span id="nav-v1">Vendedora 2</span></button>
    <button class="nav-btn" data-page="v2" onclick="goTo('v2')"><span class="nav-dot"></span><span id="nav-v2">Vendedora 3</span></button>
  </div>
  <div class="sidebar-footer">
    <button class="refresh-btn" onclick="loadData()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      Atualizar dados
    </button>
    <div class="last-update" id="last-update"><span class="status-dot"></span>Aguardando...</div>
  </div>
</nav>

<main class="main">
  <div class="err-bar" id="err-bar"></div>

  <!-- FATURAMENTO -->
  <div class="page active" id="page-fat">
    <div class="page-title">Faturamento</div>
    <div class="page-sub">Acumulado mensal por produto</div>
    <div class="kpi-row kpi-row-4" id="fat-kpis"></div>
    <div class="card">
      <div class="fat-head"><span>Produto</span><span>Acumulado</span><span>Meta mês</span><span>% da meta</span></div>
      <div id="fat-rows"></div>
      <div class="fat-foot" id="fat-foot"></div>
    </div>
  </div>

  <!-- TIME -->
  <div class="page" id="page-time">
    <div class="page-title">Resultado do time</div>
    <div class="page-sub">Consolidado de todas as vendedoras</div>
    <div class="kpi-row kpi-row-4" id="time-kpis"></div>
    <div class="team-grid" id="team-cards"></div>
    <div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px">Por semana</div>
    <div class="weeks-grid" id="time-weeks"></div>
  </div>

  <!-- VENDEDORAS v0 v1 v2 -->
  <div class="page" id="page-v0"></div>
  <div class="page" id="page-v1"></div>
  <div class="page" id="page-v2"></div>
</main>

<script>
const SHEET_ID  = '14QEyW0ZuLErufQauy9K7pPA6k4l3EM8Wl7rOOiJK6Qs';
const FAT_SHEET = 'Faturamento novo';
const COM_SHEET = 'Maio26';

const VM = [
  {nome:'Beatriz Roveri', iniciais:'BR', cor:'#7c6aff', bg:'rgba(124,106,255,0.15)'},
  {nome:'Nicole',         iniciais:'NI', cor:'#00d4aa', bg:'rgba(0,212,170,0.13)'},
  {nome:'Rayanne',        iniciais:'RA', cor:'#ffb830', bg:'rgba(255,184,48,0.13)'},
];

let DATA = {fat:[], com:null};

/* ── NAV ── */
function goTo(page){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el=document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  window.scrollTo(0,0);
}

/* ── HELPERS ── */
const fmtBRL=v=>v==null||isNaN(v)?'R$ —':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const parseBRL=s=>{if(s==null||s==='')return 0;if(typeof s==='number')return s;return parseFloat(String(s).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''))||0;};
const pctC=p=>p>=100?'c-green':p>=60?'c-teal':p>=30?'c-amber':'c-red';
const pctBar=p=>p>=100?'var(--green)':p>=60?'var(--teal)':p>=30?'var(--amber)':'var(--red)';
const totV=v=>v.semanas.reduce((a,s)=>({agend:a.agend+s.agend,reunioes:a.reunioes+s.reunioes,noshow:a.noshow+s.noshow,vendas:a.vendas+s.vendas}),{agend:0,reunioes:0,noshow:0,vendas:0});
const convRate=t=>t.reunioes>0?Math.round(t.vendas/t.reunioes*100)+'%':'—';

/* ── FETCH ── */
async function fetchSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const txt=await (await fetch(url)).text();
  const m=txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
  if(!m) throw new Error('Resposta inesperada');
  return JSON.parse(m[1]);
}

async function loadData(){
  document.getElementById('loading-screen').style.display='flex';
  document.getElementById('err-bar').style.display='none';
  const erros=[];

  try{ DATA.fat=parseFat((await fetchSheet(FAT_SHEET)).table); }
  catch(e){ erros.push('Faturamento: '+e.message); DATA.fat=demoFat(); }

  try{ DATA.com=parseCom((await fetchSheet(COM_SHEET)).table); }
  catch(e){ erros.push('Comercial: '+e.message); DATA.com=demoCom(); }

  if(erros.length){
    const eb=document.getElementById('err-bar');
    eb.style.display='block';
    eb.textContent='Atenção: '+erros.join(' | ');
  }

  renderAll();
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('last-update').innerHTML='<span class="status-dot"></span>'+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

/* ── PARSERS ── */
function parseFat(table){
  const out=[];
  for(const row of (table.rows||[])){
    if(!row.c||!row.c[0]||!row.c[0].v) continue;
    const nome=String(row.c[0].v).trim();
    if(/total|grandes|descri|instru/i.test(nome)) continue;
    const getV=i=>{const c=row.c[i];return c?(c.v!=null?c.v:parseBRL(c.f||'')):0;};
    const meta=parseBRL(getV(5)), acum=parseBRL(getV(6));
    if(meta===0&&acum===0) continue;
    out.push({nome,meta,acum,pct:meta>0?(acum/meta)*100:0});
  }
  return out.length?out:demoFat();
}

function parseCom(table){
  const semanas=['Sem 1','Sem 2','Sem 3','Sem 4'];
  const mKeys=['agend','reunioes','noshow','vendas'];

  // Inicializa com estrutura fixa baseada no VM
  const vendedores=VM.map(m=>({
    nome:m.nome, iniciais:m.iniciais, cor:m.cor, bg:m.bg,
    semanas: Array.from({length:4},()=>({agend:0,reunioes:0,noshow:0,vendas:0}))
  }));

  // Atualiza nomes na sidebar
  VM.forEach((m,i)=>{ const el=document.getElementById('nav-v'+i); if(el) el.textContent=m.nome; });

  let vi=-1;

  // Sheets bota linha 1 no cols[0].label — verifica se é nome de vendedora
  const h0=String((table.cols&&table.cols[0]&&table.cols[0].label)||'');
  for(let i=0;i<VM.length;i++){
    if(VM[i].nome.toLowerCase().split(' ').some(p=>p.length>3&&h0.toLowerCase().includes(p))){
      vi=i; break;
    }
  }

  for(const row of (table.rows||[])){
    if(!row.c||!row.c[0]) continue;
    const val=String(row.c[0].v!=null?row.c[0].v:'').trim();
    if(!val) continue;

    // Verifica se é título de vendedora
    let found=-1;
    for(let i=0;i<VM.length;i++){
      if(VM[i].nome.toLowerCase().split(' ').some(p=>p.length>3&&val.toLowerCase().includes(p))){
        found=i; break;
      }
    }
    if(found>=0){ vi=found; continue; }
    if(vi<0) continue;

    const vl=val.toLowerCase();
    let mIdx=-1;
    if(vl.includes('agend')) mIdx=0;
    else if(vl.includes('reuni')) mIdx=1;
    else if(vl.includes('no-show')||vl.includes('noshow')) mIdx=2;
    else if(vl.includes('venda')) mIdx=3;
    if(mIdx<0) continue;

    for(let s=0;s<4;s++){
      const c=row.c[s+1];
      vendedores[vi].semanas[s][mKeys[mIdx]]=c&&c.v!=null?Number(c.v)||0:0;
    }
  }

  return {semanas, vendedores};
}

/* ── DEMO ── */
function demoFat(){return [{nome:'Pontomais (40%)',meta:2000,acum:1217.46,pct:60.87},{nome:'VR Benefícios (1%)',meta:800,acum:1473.07,pct:184},{nome:'Suporte Aquisição',meta:3000,acum:720,pct:24},{nome:'Suporte Permanência',meta:3000,acum:240,pct:8},{nome:'Moskit (30%)',meta:1400,acum:0,pct:0},{nome:'VExpenses (30%)',meta:200,acum:0,pct:0},{nome:'Todos de Benefícios',meta:500,acum:50,pct:10},{nome:'Seven Saúde B2B',meta:40000,acum:798.40,pct:2}];}
function demoCom(){return {semanas:['Sem 1','Sem 2','Sem 3','Sem 4'],vendedores:[{...VM[0],semanas:[{agend:1,reunioes:3,noshow:0,vendas:1},{agend:2,reunioes:2,noshow:0,vendas:0},{agend:0,reunioes:0,noshow:0,vendas:0},{agend:0,reunioes:0,noshow:0,vendas:0}]},{...VM[1],semanas:[{agend:3,reunioes:2,noshow:1,vendas:0},{agend:4,reunioes:4,noshow:1,vendas:3},{agend:0,reunioes:0,noshow:0,vendas:0},{agend:0,reunioes:0,noshow:0,vendas:0}]},{...VM[2],semanas:[{agend:3,reunioes:6,noshow:0,vendas:2},{agend:3,reunioes:4,noshow:0,vendas:0},{agend:0,reunioes:0,noshow:0,vendas:0},{agend:0,reunioes:0,noshow:0,vendas:0}]}]};}

/* ── RENDER ALL ── */
function renderAll(){
  renderFat();
  renderTime();
  renderSellers();
}

/* ── FAT ── */
function renderFat(){
  const fat=DATA.fat;
  let tM=0,tA=0;
  fat.forEach(p=>{tM+=p.meta;tA+=p.acum;});
  const tP=tM>0?(tA/tM)*100:0;
  const top=fat.reduce((a,b)=>b.acum>a.acum?b:a,fat[0]||{nome:'—',acum:0});

  document.getElementById('fat-kpis').innerHTML=`
    <div class="kpi" style="border-color:rgba(34,212,124,0.2)"><div class="kpi-label">Acumulado total</div><div class="kpi-val c-green">${fmtBRL(tA)}</div><div class="kpi-sub">${tP.toFixed(1)}% da meta</div></div>
    <div class="kpi"><div class="kpi-label">Meta mensal</div><div class="kpi-val c-muted">${fmtBRL(tM)}</div><div class="kpi-sub">todos os produtos</div></div>
    <div class="kpi" style="border-color:rgba(124,106,255,0.2)"><div class="kpi-label">Falta para a meta</div><div class="kpi-val c-accent">${fmtBRL(Math.max(0,tM-tA))}</div><div class="kpi-sub">${(100-Math.min(tP,100)).toFixed(1)}% restante</div></div>
    <div class="kpi" style="border-color:rgba(0,212,170,0.2)"><div class="kpi-label">Melhor produto</div><div class="kpi-val c-teal" style="font-size:16px;padding-top:6px">${top.nome}</div><div class="kpi-sub">${fmtBRL(top.acum)}</div></div>`;

  document.getElementById('fat-rows').innerHTML=fat.map(p=>`
    <div class="fat-row">
      <div style="font-size:13px">${p.nome}</div>
      <div class="fat-acum ${pctC(p.pct)}">${fmtBRL(p.acum)}</div>
      <div class="fat-meta">${fmtBRL(p.meta)}</div>
      <div class="fat-pct-cell">
        <span class="fat-pct ${pctC(p.pct)}">${p.pct.toFixed(1)}%</span>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(p.pct,100)}%;background:${pctBar(p.pct)}"></div></div>
      </div>
    </div>`).join('');

  document.getElementById('fat-foot').innerHTML=`<span>Total</span><span class="${pctC(tP)}">${fmtBRL(tA)}</span><span class="c-muted">${fmtBRL(tM)}</span><span class="${pctC(tP)}">${tP.toFixed(1)}%</span>`;
}

/* ── TIME ── */
function renderTime(){
  const {semanas,vendedores}=DATA.com;
  const grand=vendedores.reduce((a,v)=>{v.semanas.forEach(s=>{a.agend+=s.agend;a.reunioes+=s.reunioes;a.noshow+=s.noshow;a.vendas+=s.vendas;});return a;},{agend:0,reunioes:0,noshow:0,vendas:0});
  const cv=grand.reunioes>0?Math.round(grand.vendas/grand.reunioes*100):0;

  document.getElementById('time-kpis').innerHTML=`
    <div class="kpi" style="border-color:rgba(124,106,255,0.2)"><div class="kpi-label">Agendamentos</div><div class="kpi-val c-accent">${grand.agend}</div><div class="kpi-sub">no mês</div></div>
    <div class="kpi" style="border-color:rgba(0,212,170,0.2)"><div class="kpi-label">Reuniões realizadas</div><div class="kpi-val c-teal">${grand.reunioes}</div><div class="kpi-sub">no mês</div></div>
    <div class="kpi" style="border-color:rgba(34,212,124,0.2)"><div class="kpi-label">Vendas fechadas</div><div class="kpi-val c-green">${grand.vendas}</div><div class="kpi-sub">conversão: ${cv}%</div></div>
    <div class="kpi" style="border-color:rgba(255,91,91,0.15)"><div class="kpi-label">No-show</div><div class="kpi-val ${grand.noshow>0?'c-red':'c-muted'}">${grand.noshow}</div><div class="kpi-sub">de ${grand.reunioes} reuniões</div></div>`;

  document.getElementById('team-cards').innerHTML=vendedores.map((v,i)=>{
    const t=totV(v);
    return `<div class="team-card" onclick="goTo('v${i}')">
      <div class="tc-header">
        <div class="avatar" style="background:${v.bg};color:${v.cor}">${v.iniciais}</div>
        <div><div class="tc-name">${v.nome}</div><div class="tc-conv">Conversão: <strong style="color:${v.cor}">${convRate(t)}</strong></div></div>
        <div class="badge" style="background:${v.bg};color:${v.cor}">${t.vendas} venda${t.vendas!==1?'s':''}</div>
      </div>
      <div class="tc-nums">
        <div class="tc-cell"><div class="tc-label">Agend.</div><div class="tc-val c-accent">${t.agend}</div></div>
        <div class="tc-cell"><div class="tc-label">Reun.</div><div class="tc-val" style="color:${v.cor}">${t.reunioes}</div></div>
        <div class="tc-cell"><div class="tc-label">No-show</div><div class="tc-val ${t.noshow>0?'c-red':'c-dim'}">${t.noshow}</div></div>
        <div class="tc-cell"><div class="tc-label">Vendas</div><div class="tc-val c-green">${t.vendas}</div></div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('time-weeks').innerHTML=semanas.map((sem,i)=>{
    const st=vendedores.reduce((a,v)=>({agend:a.agend+v.semanas[i].agend,reunioes:a.reunioes+v.semanas[i].reunioes,noshow:a.noshow+v.semanas[i].noshow,vendas:a.vendas+v.semanas[i].vendas}),{agend:0,reunioes:0,noshow:0,vendas:0});
    const empty=st.agend===0&&st.reunioes===0;
    return `<div class="week-card" style="opacity:${empty?0.4:1}">
      <div class="week-label-title">${sem}</div>
      <div class="week-nums">
        <div class="week-num-item"><div class="wn-label">Agend.</div><div class="wn-val c-accent">${st.agend}</div></div>
        <div class="week-num-item"><div class="wn-label">Reuniões</div><div class="wn-val c-teal">${st.reunioes}</div></div>
        <div class="week-num-item"><div class="wn-label">No-show</div><div class="wn-val ${st.noshow>0?'c-red':'c-dim'}">${st.noshow}</div></div>
        <div class="week-num-item"><div class="wn-label">Vendas</div><div class="wn-val c-green">${st.vendas}</div></div>
      </div>
    </div>`;
  }).join('');
}

/* ── SELLERS ── */
function renderSellers(){
  const {semanas,vendedores}=DATA.com;
  const metricas=[
    {key:'agend',   label:'Agendamentos realizados', cor:'var(--accent)'},
    {key:'reunioes',label:'Reuniões realizadas',      cor:null},
    {key:'noshow',  label:'No-show',                  cor:'var(--red)', isNS:true},
    {key:'vendas',  label:'Vendas realizadas',         cor:'var(--green)'},
  ];

  vendedores.forEach((v,i)=>{
    const t=totV(v);
    const cols=`140px repeat(${semanas.length},1fr) 80px`;

    const headCells=`<div class="wt-cell">Métrica</div>`+
      semanas.map(s=>`<div class="wt-cell" style="text-align:center">${s}</div>`).join('')+
      `<div class="wt-cell" style="text-align:center">Total</div>`;

    const bodyRows=metricas.map(m=>{
      const vals=v.semanas.map(s=>s[m.key]);
      const total=vals.reduce((a,b)=>a+b,0);
      const cor=m.isNS?(total>0?'var(--red)':'var(--dim)'):(total===0?'var(--dim)':(m.cor||v.cor));
      return `<div class="wt-row" style="grid-template-columns:${cols}">
        <div class="wt-name">${m.label}</div>
        ${vals.map((val,si)=>{
          const e=v.semanas[si].agend===0&&v.semanas[si].reunioes===0&&v.semanas[si].noshow===0&&v.semanas[si].vendas===0;
          const c=m.isNS?(val>0?'var(--red)':'var(--dim)'):(val===0?'var(--dim)':(m.cor||v.cor));
          return `<div class="wt-val" style="color:${c};opacity:${e?0.35:1}">${val}</div>`;
        }).join('')}
        <div class="wt-val" style="color:${cor};font-size:17px">${total}</div>
      </div>`;
    }).join('');

    document.getElementById('page-v'+i).innerHTML=`
      <div class="page-title">${v.nome}</div>
      <div class="page-sub">Desempenho individual no mês</div>
      <div class="seller-hero">
        <div class="hero-av" style="background:${v.bg};color:${v.cor}">${v.iniciais}</div>
        <div>
          <div class="hero-name">${v.nome}</div>
          <div class="hero-sub">Taxa de conversão: <strong style="color:${v.cor}">${convRate(t)}</strong></div>
        </div>
        <div class="hero-badges">
          <div class="hero-badge" style="background:var(--accent-dim);color:var(--accent)">${t.agend} agendamentos</div>
          <div class="hero-badge" style="background:${v.bg};color:${v.cor}">${t.vendas} venda${t.vendas!==1?'s':''}</div>
          <div class="hero-badge" style="background:${t.noshow>0?'var(--red-dim)':'var(--green-dim)'};color:${t.noshow>0?'var(--red)':'var(--green)'}">${t.noshow} no-show</div>
        </div>
      </div>
      <div class="kpi-row kpi-row-3" style="margin-bottom:22px">
        <div class="kpi" style="border-color:rgba(124,106,255,0.2)"><div class="kpi-label">Agendamentos</div><div class="kpi-val c-accent">${t.agend}</div><div class="kpi-sub">no mês</div></div>
        <div class="kpi" style="border-color:rgba(0,212,170,0.2)"><div class="kpi-label">Reuniões realizadas</div><div class="kpi-val" style="color:${v.cor}">${t.reunioes}</div><div class="kpi-sub">no mês</div></div>
        <div class="kpi" style="border-color:rgba(34,212,124,0.2)"><div class="kpi-label">Vendas fechadas</div><div class="kpi-val c-green">${t.vendas}</div><div class="kpi-sub">conversão: ${convRate(t)}</div></div>
      </div>
      <div class="weeks-table">
        <div class="wt-head" style="grid-template-columns:${cols}">${headCells}</div>
        ${bodyRows}
      </div>`;
  });
}

loadData();
</script>
</body>
</html>
